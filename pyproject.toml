[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pace-sim2real"
version = "0.1.2"
description = "PACE sim-to-real system identification for legged robots, powered by mjlab"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "ETH Zurich, Robotic Systems Lab" },
]
keywords = ["mjlab", "mujoco", "sim2real", "system-identification", "cma-es", "pace"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "cmaes>=0.12,<0.13",
  "matplotlib>=3.8",
  "mjlab==1.5.2",
]

[project.urls]
Homepage = "https://fan-ziqi.github.io/pace-sim2real-mjlab/"
Documentation = "https://fan-ziqi.github.io/pace-sim2real-mjlab/"
Source = "https://github.com/fan-ziqi/pace-sim2real-mjlab"
Upstream = "https://github.com/leggedrobotics/pace-sim2real"

[project.scripts]
pace-data-collection = "pace_sim2real.scripts.data_collection:main"
pace-fit = "pace_sim2real.scripts.fit:main"
pace-plot-trajectory = "pace_sim2real.scripts.plot_trajectory:main"
pace-list-envs = "pace_sim2real.scripts.list_envs:main"
pace-train = "pace_sim2real.scripts.train:main"
pace-play = "pace_sim2real.scripts.play:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.11",
]
docs = [
  "mkdocs-material>=9.6",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.setuptools]
package-dir = {"" = "source/pace_sim2real"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["source/pace_sim2real"]

[tool.setuptools.package-data]
pace_sim2real = ["assets/anymal_d/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:launch_testing -p no:launch_testing_ros -p no:ament_lint -p no:ament_flake8 -p no:launch_ros"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["source/pace_sim2real", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]
